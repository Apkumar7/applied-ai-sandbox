<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Note · Sandbox</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --text-muted: #666;
      --border: #ddd;
      --surface: #ffffff;
      --input-bg: #ffffff;
      --btn-bg: #1a2540;
      --btn-text: #fff;
      --toggle-bg: #e2e8f0;
      --toggle-text: #1a2540;
      --error: #b00020;
    }
    html.dark {
      --bg: #0f1117;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2d3748;
      --surface: #1a1d2e;
      --input-bg: #1e293b;
      --btn-bg: #3b82f6;
      --btn-text: #fff;
      --toggle-bg: #1e293b;
      --toggle-text: #93c5fd;
      --error: #f87171;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      background: var(--input-bg);
      color: var(--text);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .actions { margin-top: 1.5rem; }
    button.save {
      background: var(--btn-bg);
      color: var(--btn-text);
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    a { color: var(--text-muted); margin-left: 1rem; }
    .error { color: var(--error); margin-top: 0.25rem; font-size: 0.9rem; }
    #theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
  </style>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()"></button>

  <h1>New note</h1>

  <form method="POST">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" value="{{ title or '' }}">
    {% if title_error %}<p class="error">{{ title_error }}</p>{% endif %}

    <label for="body">Body</label>
    <textarea id="body" name="body" rows="6">{{ body or '' }}</textarea>
    {% if body_error %}<p class="error">{{ body_error }}</p>{% endif %}

    <label for="tags">Tags <span style="font-weight:400; color:var(--text-muted)">(comma-separated, optional)</span></label>
    <input id="tags" name="tags" type="text" value="{{ tags or '' }}" placeholder="e.g. work, urgent">

    <div class="actions">
      <button class="save" type="submit">Save note</button>
      <a href="{{ url_for('home') }}">Cancel</a>
    </div>
  </form>

  <script>
    const btn = document.getElementById('theme-toggle');
    function applyLabel() {
      btn.textContent = document.documentElement.classList.contains('dark') ? 'Light mode' : 'Dark mode';
    }
    function toggleTheme() {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      applyLabel();
    }
    applyLabel();
  </script>
</body>
</html>
